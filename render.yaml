# Free-tier deploy: one Web Service serves API + static frontend (no paid disk).
# Dashboard → New → Blueprint → connect this repo.

services:
  - type: web
    name: sdui
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
